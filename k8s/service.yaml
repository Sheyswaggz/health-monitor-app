apiVersion: v1
kind: Service
metadata:
  name: health-tracker-service
  namespace: production
  labels:
    app: health-tracker
    version: v1.0.0
    component: backend
    tier: application
    managed-by: gitops
  annotations:
    description: "Health tracker application internal service"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: health-tracker
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800